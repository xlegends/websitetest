name: Build self-contained jpxfrd JAR

on:
  push:
    branches:
      - build/jpxfrd-selfcontained-20260805
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build executable JAR with bundled Chromium
        shell: pwsh
        working-directory: app
        run: mvn -B -U clean package

      - name: Verify native runtime is embedded
        shell: pwsh
        working-directory: app
        run: |
          $jar = 'target/jpxfrd-chromium.jar'
          if (!(Test-Path $jar)) { throw 'JAR was not produced' }
          $size = (Get-Item $jar).Length
          if ($size -lt 100MB) { throw "JAR is unexpectedly small: $size bytes" }
          $matches = jar tf $jar | Select-String 'jcef-natives-windows-amd64.*\.tar\.gz'
          if (!$matches) { throw 'Embedded Windows JCEF native archive not found' }
          $matches
          Write-Host "Verified self-contained JAR: $size bytes"

      - name: Upload self-contained JAR
        uses: actions/upload-artifact@v4
        with:
          name: jpxfrd-chromium-selfcontained-windows-x64
          path: app/target/jpxfrd-chromium.jar
          if-no-files-found: error
          compression-level: 0
